[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-playground"
version = "0.1.0"
description = "Interactive playground for classic algorithms — Streamlit GUI + Rich CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.51,<2",
    "pandas>=2.0,<3",
    "plotly>=5.18,<7",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8",
    "mypy>=1.8",
]

[tool.setuptools]
packages = ["algorithms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Streamlit scripts intentionally run at import time
"app.py" = ["E402"]
